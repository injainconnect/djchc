<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙏</text></svg>">
    <meta name="description" content="Group jaap counter — track collective mantra chanting toward a shared target with the DJCHC community.">
    <title>Jaap - DJCHC Hyderabad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script>(function(){try{var t=localStorage.getItem("djchc-theme")||"aurora",l=localStorage.getItem("djchc-layout")||"focus";var e=document.documentElement;e.setAttribute("data-theme",t);e.setAttribute("data-layout",l);}catch(x){}})();</script>

    <nav id="common-nav"></nav>

    <div class="banner">
        <h1><i class="fas fa-om"></i> Group Jaap</h1>

    </div>

    <div class="container">
        <section id="jaap-root">
            <p class="news-status"><i class="fas fa-spinner fa-spin"></i> Loading&hellip;</p>
        </section>
    </div>

    <footer id="common-footer"></footer>
    <script src="js/common.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/jaap.js"></script>
</body>
</html>
